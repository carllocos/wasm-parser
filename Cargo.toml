[package]
name = "wasm-parser"
version = "0.1.0"
edition = "2021"
description = "Rust WasmModule parser (using wasmparser) exposed to TypeScript via wasm-bindgen"
license = "GPL-3.0-only OR MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.127"
wasmparser = "=0.236.1"
