name: Build wasm bindings

on:
  push:
    branches: [main]

  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - name: Build bindings
        run: wasm-pack build --target nodejs --out-dir pkg

      - name: Commit rebuilt pkg/ if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pkg
          if git diff --cached --quiet; then
            echo "pkg/ unchanged, nothing to commit"
          else
            git commit -m "chore: rebuild wasm bindings [skip ci]"
            git push
          fi

      - name: Tag release if Cargo.toml version changed
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="v$VERSION"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag $TAG already exists on origin, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
